services:
  meeting-buddy-receiver:
    build: .
    image: ai-meeting-buddy-receiver:local
    container_name: ai-meeting-buddy-receiver
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      - OUTPUT_DIR=/app/transcripts
    volumes:
      - /home/merlin/portainer_data/ai-meeting-buddy/transcripts_data:/app/transcripts
      - /home/merlin/portainer_data/ai-meeting-buddy/whisper_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

