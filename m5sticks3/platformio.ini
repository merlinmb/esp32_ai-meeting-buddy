; AI Meeting Buddy firmware
; Board: M5 StickS3 (ESP32-S3)
; Open this folder in VS Code with the PlatformIO extension installed.
;
; Board definition (boards/_boards_json/m5stack-sticks3.json) and pin
; variant (boards/pinouts/pins_arduino.h) are copied from the Bruce
; firmware's verified m5stack-sticks3 board files.

[platformio]
boards_dir = boards/_boards_json

[env:m5sticks3]

platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; loop()'s task stack is otherwise the Arduino-ESP32 default (8192B) -
    ; too tight once wifi_uploader.h's 8KB upload chunk buffer plus
    ; WiFiClientSecure's own TLS buffers are on the same call stack.
    ; (ARDUINO_LOOP_STACK_SIZE, not CONFIG_ARDUINO_LOOP_STACK_SIZE - the
    ; latter is already defined in sdkconfig.h, so a -D of it here would
    ; just conflict with that instead of overriding main.cpp's default.)
    -DARDUINO_LOOP_STACK_SIZE=16384
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified
    M5PM1=https://github.com/m5stack/M5PM1

