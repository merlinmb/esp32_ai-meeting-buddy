; AI Meeting Buddy firmware
; Board: Waveshare ESP32-C6-LCD-1.69
; Open this folder in VS Code with the PlatformIO extension installed.

[env:waveshare_c6_lcd169]
platform = espressif32
board = esp32-c6-devkitm-1   ; closest generic PlatformIO board def for the ESP32-C6; pin mapping comes from src/pins.h, not from this board def
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DARDUINO_USB_MODE=1          ; ESP32-C6 uses the integrated USB-Serial-JTAG peripheral for flashing (ROM-level download mode - unaffected by the CDC setting below)
    -DARDUINO_USB_CDC_ON_BOOT=0   ; the native USB D+/D- pins are repurposed as the SD card's MOSI/MISO (see pins.h) - CDC must stay off so the running sketch doesn't fight the SD card for those two pins. Serial.print() becomes a silent no-op; flashing/upload still works via the BOOT+RESET button combo, independent of this app-level flag.
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.4.9   ; ST7789 driver, arbitrary-pin SPI support
